plugins {
    id 'java'
    id 'org.gradle.test-retry' version '1.6.5'
}

group = 'com.oleynik.qa.workshop'
version = '1.1.1'
description = 'JUnit 4 workshop examples'

def versions = [
        junit                     : '4.13.2',
        junitParams               : '1.1.1',
        dataProvider              : '2.12',
        openCsv                   : '5.12.0',
        assertJ                   : '3.27.7',
        hamcrest                  : '3.0',
        lombok                    : '1.18.48',
        junitRunners              : '1.3',
        hierarchicalContextRunner : '4.12.2'
]

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("junit:junit:${versions.junit}") {
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    }
    implementation "com.tngtech.junit.dataprovider:junit4-dataprovider:${versions.dataProvider}"
    implementation "com.opencsv:opencsv:${versions.openCsv}"

    compileOnly "org.projectlombok:lombok:${versions.lombok}"
    annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
    testCompileOnly "org.projectlombok:lombok:${versions.lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${versions.lombok}"

    testImplementation "pl.pragmatists:JUnitParams:${versions.junitParams}"
    testImplementation "org.assertj:assertj-core:${versions.assertJ}"
    testImplementation "org.hamcrest:hamcrest-library:${versions.hamcrest}"
    testImplementation("com.nitorcreations:junit-runners:${versions.junitRunners}") {
        exclude group: 'org.javassist', module: 'javassist'
    }
    testImplementation "de.bechte.junit:junit-hierarchicalcontextrunner:${versions.hierarchicalContextRunner}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs += '-Xlint'
    options.encoding = 'UTF-8'
}

def configureWorkshopTest = { Test testTask ->
    testTask.include '**/Test*.class',
            '**/*Test.class',
            '**/*Tests.class',
            '**/*TestCase.class',
            '**/*Suite.class'
    testTask.systemProperties System.getProperties()
    testTask.systemProperty 'file.encoding', 'UTF-8'
    testTask.testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
    testTask.reports {
        junitXml.required = true
        html.required = true
    }
    testTask.retry {
        maxRetries = (project.findProperty('retryCount') ?: '0') as int
        maxFailures = 100
        failOnPassedAfterRetry = true
    }
    testTask.doFirst {
        def commandLinePatterns = testTask.filter.commandLineIncludePatterns
        if (!commandLinePatterns.isEmpty() && commandLinePatterns.every { !it.contains('Suite') }) {
            testTask.exclude '**/*Suite.class'
        }
    }
}

test {
    configureWorkshopTest(delegate)

    String includedCategoriesProperty = System.getProperty('includeCategories') ?: System.getProperty('groups')
    String excludedCategoriesProperty = System.getProperty('excludeCategories')
    List<String> includedCategories = includedCategoriesProperty?.split(',')?.collect { it.trim() }?.findAll { !it.isEmpty() }
    List<String> excludedCategories = excludedCategoriesProperty?.split(',')?.collect { it.trim() }?.findAll { !it.isEmpty() }

    useJUnit {
        if (includedCategories) {
            includeCategories(*includedCategories)
        }
        if (excludedCategories) {
            excludeCategories(*excludedCategories)
        }
    }

    if (includedCategories || excludedCategories) {
        exclude '**/*Suite.class'
    }
}

def registerCategoryTest = { String taskName, String categoryClass ->
    tasks.register(taskName, Test) {
        group = LifecycleBasePlugin.VERIFICATION_GROUP
        description = "Runs JUnit 4 tests in category ${categoryClass}."
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        configureWorkshopTest(delegate)
        useJUnit {
            includeCategories categoryClass
        }
        exclude '**/*Suite.class'
        shouldRunAfter tasks.named('test')
    }
}

registerCategoryTest('smokeTest', 'com.oleynik.qa.workshop.junit.grouping.categories.SmokeTests')
registerCategoryTest('regressionTest', 'com.oleynik.qa.workshop.junit.grouping.categories.RegressionTests')
